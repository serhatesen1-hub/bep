                <tbody><tr><td style="height:60px; vertical-align:top">1. Öğrencinin ilgisini çekecek pekiştireçler kullanılacaktır.<br>2. Bir sonraki toplantı tarihi: ${fmtDate(std.bepEndDate)}</td></tr></tbody>
              </table>
              <div class="nobreak">
                <table>
                  <colgroup><col style="width:30%"><col style="width:35%"><col style="width:35%"></colgroup>
                  <thead>
                    <tr><th class="bar" colspan="3">V- BEP GELİŞTİRME BİRİM ÜYELERİ</th></tr>
                    <tr><th>Unvanı</th><th>Adı Soyadı</th><th>İmza</th></tr>
                  </thead>
                  <tbody>
                    ${sigRows}
                  </tbody>
                </table>
                <div class="sign-final">
                  <p>Uygundur</p>
                  <p>..... / ..... / 20...</p>
                  <p class="sigspace"></p>
                  <p>${esc(std.principalName) || '.............................'}</p>
                  <p>Okul Müdürü</p>
                </div>
              </div>
            </div>`;

            return part1 + part2 + part3;
        }

        function buildEvaluationFormsHtml(std) {
            const teacher = esc(`${appState.currentUser.firstName} ${appState.currentUser.lastName}`.trim());
            const crit = esc(std.criterion || '4/5 (%80)');
            return std.bep.map((area, ai) => {
                const rows = area.kdaList.map(kda => `
                  <tr>
                    <td>${esc(stripCode(area, kda.description))}</td><td class="c sm">${crit}</td>
                    <td class="mark"></td><td class="mark"></td><td class="mark"></td><td class="mark"></td><td class="mark"></td>
                  </tr>`).join('');
                const dateTh = '<th class="sm">.../.../20...</th>'.repeat(5);
                return `
                <div class="doc doc-portrait paper WordSection1 ${ai > 0 ? 'sec-break' : ''}" data-sheet="${esc(area.area)}" data-chars="110">
                  <h2 class="doc-title">${esc(area.area.toLocaleUpperCase('tr-TR'))} ÖLÇÜT BAĞIMLI ÖLÇÜ ARACI (ÖBÖA)</h2>
                  <p class="doc-sub">Öğrenci İzleme ve Gelişim Formu</p>
                  <table>
                    <colgroup><col style="width:30%"><col style="width:70%"></colgroup>
                    <tbody>
                      <tr><td class="k">Öğrenci</td><td>${esc(std.firstName)} ${esc(std.lastName)}</td></tr>
                      <tr><td class="k">Sınıfı / No</td><td>${classLabel(std)} / ${esc(std.schoolNo)}</td></tr>
                      <tr><td class="k">Uygulayıcı</td><td>${teacher}</td></tr>
                      <tr><td class="k">BEP Dönemi</td><td>${fmtDate(std.bepStartDate)} - ${fmtDate(std.bepEndDate)}</td></tr>
                    </tbody>
                  </table>
                  <table>
                    <colgroup><col style="width:30%"><col style="width:10%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%"></colgroup>
                    <thead>
                      <tr><th class="bar dark" colspan="7">UDA: ${esc(area.uda)}</th></tr>
                      <tr><th rowspan="2">Kısa Dönemli Amaçlar (KDA)</th><th rowspan="2">Ölçüt</th><th colspan="5">Değerlendirme Tarihleri</th></tr>
                      <tr>${dateTh}</tr>
                    </thead>
                    <tbody>${rows}</tbody>
                  </table>
                  <div class="note nobreak">
                    <strong>Puanlama Anahtarı:</strong> Değerlendirme sırasında kazanılan beceri basamağına (+), henüz kazanılamayanlara (-) yazınız.<br>
                    <strong>İpucu Kısaltmaları:</strong> B (Bağımsız), Sİ (Sözel İpucu), MY (Model Olma), FY (Fiziksel Yardım)
                  </div>
                </div>`;
            }).join('');
        }

        function docToolbar(std, backHtml, wrapperId, suffix, fileLabel) {
            const base = fileBase(std);
            const id = Number(std.id);
            return `
              <div class="w-full max-w-[210mm] mb-6 flex flex-col md:flex-row gap-3 justify-between hide-on-print bg-white p-4 rounded-xl shadow-md border border-slate-300">
                <div class="flex flex-wrap gap-2">
                  <button onclick="goHome()" class="text-slate-700 font-bold flex items-center bg-slate-100 px-4 py-2 rounded-lg hover:bg-slate-200 transition"><i data-lucide="home" class="mr-2 w-4 h-4"></i> Ana Sayfa</button>
                  ${backHtml}
                  <button onclick="editStudent(${id})" class="text-slate-600 font-bold flex items-center bg-slate-100 px-4 py-2 rounded-lg hover:bg-slate-200 transition"><i data-lucide="edit" class="mr-2 w-4 h-4"></i> Düzenle</button>
                  <button onclick="deleteStudentAndGoHome(${id})" class="text-red-600 font-bold flex items-center bg-red-50 px-4 py-2 rounded-lg hover:bg-red-100 transition"><i data-lucide="trash-2" class="mr-2 w-4 h-4"></i> Sil</button>
                </div>
                <div class="flex flex-wrap gap-2">
                  ${wrapperId === 'bep-wrapper' ? `<button onclick="setView('evalFormsView')" class="bg-indigo-600 text-white px-5 py-2 rounded-lg font-bold shadow-sm hover:bg-indigo-700">Değerlendirme Formları (ÖBÖA)</button><button onclick="setView('measure')" class="bg-teal-600 text-white px-5 py-2 rounded-lg font-bold shadow-sm hover:bg-teal-700">Ölçme Değerlendirme</button><button onclick="setView('abc')" class="bg-rose-600 text-white px-5 py-2 rounded-lg font-bold shadow-sm hover:bg-rose-700">ABC Kaydı</button><button onclick="setView('activities')" class="bg-amber-600 text-white px-5 py-2 rounded-lg font-bold shadow-sm hover:bg-amber-700">Etkinlik ve Materyal</button>` : ''}
                  <button onclick="exportXlsx('${wrapperId}', '${base}_${suffix}.xlsx')" class="bg-green-700 text-white px-5 py-2 rounded-lg font-bold hover:bg-green-800">Excel'e Aktar</button>
                  <button onclick="exportHTMLToWord('${wrapperId}', '${base}_${suffix}.doc')" class="bg-slate-700 text-white px-5 py-2 rounded-lg font-bold hover:bg-slate-800">Word'e Aktar</button>
                  <button onclick="printDoc()" class="bg-blue-800 text-white px-6 py-2 rounded-lg flex items-center font-bold shadow-lg hover:bg-blue-900 transition"><i data-lucide="printer" class="mr-2 w-5 h-5"></i> Yazdır / PDF</button>
                </div>
              </div>`;
        }

        // ==========================================
        // ÖLÇME DEĞERLENDİRME (çevrim içi doldurma + form çıktısı)
        // ==========================================
        const MEASURE_METHODS = ['Gözlem', 'Performans Görevi', 'Sözlü Soru-Cevap', 'Kontrol Listesi', 'Çalışma Kâğıdı'];
        function isoOf(v) {
            const t = String(v || '');
            if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
            const m = t.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
            return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : '';
        }
        function rangeText(a, b) { const x = showDate(a), y = showDate(b); return (x || y) ? `${x}<br>-<br>${y}` : ''; }
        function showDate(v) { const i = isoOf(v); return i ? fmtDate(i) : ''; }
        function resultText(r) { return r === 'yapiyor' ? '(+) Yapıyor' : r === 'yapamiyor' ? '(-) Yapamıyor' : '(+) / (-)'; }

        function measureCounts(std) {
            let yes = 0, no = 0, total = 0;
            (std.bep || []).forEach(a => (a.kdaList || []).forEach(k => { total++; if (k.result === 'yapiyor') yes++; else if (k.result === 'yapamiyor') no++; }));
            return { yes, no, total, left: total - yes - no };
        }
        function areaCounts(area) {
            let yes = 0, no = 0, total = 0;
            (area.kdaList || []).forEach(k => { total++; if (k.result === 'yapiyor') yes++; else if (k.result === 'yapamiyor') no++; });
            return { yes, no, total, left: total - yes - no };
        }
        function curMeasureCourse(std) {
            const n = (std.bep || []).length;
            const i = Number.isInteger(std.measureCourse) ? std.measureCourse : 0;
            return i >= 0 && i < n ? i : 0;
        }
        function updateMeasureSummary(ai) {
            const std = appState.generatedBEP; if (!std) return;
            const c = areaCounts(std.bep[ai]);
            const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
            set('ms_yes', c.yes); set('ms_no', c.no); set('ms_left', c.left);
            set('tabp_' + ai, `${c.yes + c.no}/${c.total} işaretlendi`);
        }
        function setMeasure(ai, ki, field, value) {
            const std = appState.generatedBEP; if (!std) return;
            const kk = std.bep[ai].kdaList[ki];
            kk[field] = value;
            let refill = false;
            if (field === 'measureDate') kk.measureAuto = false;
            if (field === 'endDate' || field === 'startDate') {
                if (!kk.measureDate || kk.measureAuto) {
                    const nd = kk.endDate || '';
                    if (nd !== kk.measureDate) { kk.measureDate = nd; refill = true; }
                    kk.measureAuto = !!nd;
                }
            }
            saveStore(); updateMeasureSummary(ai);
            if (refill) { const y = window.scrollY; renderApp(); window.scrollTo(0, y); }
            const el = document.getElementById(`sv_${ai}_${ki}`);
            if (el) { el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1800); }
        }
        function clearMeasureResult(ai, ki) {
            setMeasure(ai, ki, 'result', '');
            const y = window.scrollY; renderApp(); window.scrollTo(0, y);
        }
        function selectMeasureCourse(ai) {
            const std = appState.generatedBEP; if (!std) return;
            std.measureCourse = ai; saveStore(); renderApp(); window.scrollTo(0, 0);
        }
        function openMeasure(id) {
            const std = appState.students.find(s => s.id === id);
            if (!std) return;
            appState.generatedBEP = std; setView('measure');
        }
        function openActivities(id) {
            const std = appState.students.find(s => s.id === id);
            if (!std) return;
            appState.generatedBEP = std; setView('activities');
        }
        function openMeasureDoc(all) {
            const std = appState.generatedBEP; if (!std) return;
            appState.measureDocSel = all ? std.bep.map((_, i) => i) : [curMeasureCourse(std)];
            setView('measureDoc');
        }
        function toggleMeasureDoc(ai) {
            const sel = appState.measureDocSel || [];
            const i = sel.indexOf(ai);
            if (i > -1) { if (sel.length === 1) return; sel.splice(i, 1); } else sel.push(ai);
            appState.measureDocSel = sel.sort((a, b) => a - b);
            renderApp();
        }

        function renderMeasure() {
            const std = appState.generatedBEP;
            if (!std) return '';
            const cur = curMeasureCourse(std);
            const area = std.bep[cur];
            const c = areaCounts(area);
            const tabs = std.bep.map((a, i) => {
                const ac = areaCounts(a);
                return `<button type="button" class="tab ${i === cur ? 'on' : ''}" onclick="selectMeasureCourse(${i})" aria-pressed="${i === cur}"><span>${esc(a.area)}</span><small id="tabp_${i}">${ac.yes + ac.no}/${ac.total} işaretlendi</small></button>`;
            }).join('');
            const goals = (area.kdaList || []).map((k, ki) => `
                  <div class="mgoal">
                    <p class="mgoal-text">${ki + 1}. ${esc(stripCode(area, k.description))}</p>
                    <div class="mgrid">
                      <label class="field"><span>Başlama tarihi</span><input type="date" value="${isoOf(k.startDate)}" onchange="setMeasure(${cur},${ki},'startDate',this.value)" /></label>
                      <label class="field"><span>Bitiş tarihi</span><input type="date" value="${isoOf(k.endDate)}" onchange="setMeasure(${cur},${ki},'endDate',this.value)" /></label>
                      <label class="field"><span>Ölçme tarihi${k.measureAuto ? ' (otomatik)' : ''}</span><input type="date" value="${isoOf(k.measureDate)}" onchange="setMeasure(${cur},${ki},'measureDate',this.value)" /></label>
                      <label class="field"><span>Ölçme yöntemi</span><select onchange="setMeasure(${cur},${ki},'measureMethod',this.value)">${MEASURE_METHODS.map(m => `<option ${((k.measureMethod || 'Gözlem') === m) ? 'selected' : ''}>${m}</option>`).join('')}</select></label>
                    </div>
                    <div class="mresult">
                      <div class="seg" role="radiogroup" aria-label="Sonuç">
                        <label class="seg-opt ok"><input type="radio" name="r_${cur}_${ki}" value="yapiyor" ${k.result === 'yapiyor' ? 'checked' : ''} onchange="setMeasure(${cur},${ki},'result','yapiyor')"><span>Yapıyor</span></label>
                        <label class="seg-opt no"><input type="radio" name="r_${cur}_${ki}" value="yapamiyor" ${k.result === 'yapamiyor' ? 'checked' : ''} onchange="setMeasure(${cur},${ki},'result','yapamiyor')"><span>Yapamıyor</span></label>
                      </div>
                      <button type="button" class="btn-link" onclick="clearMeasureResult(${cur},${ki})">Temizle</button>
                      <span class="saved" id="sv_${cur}_${ki}">Kaydedildi &#10003;</span>
                    </div>
                  </div>`).join('');
            return `
            <div class="app">
              ${appBar('Ölçme Değerlendirme', "setView('bepView')", '')}
              <main class="page narrow">
                <section class="card">
                  <h2 class="card-title">${esc(std.firstName)} ${esc(std.lastName)}</h2>
                  <p class="muted">${classLabel(std)} &bull; BEP dönemi: ${fmtDate(std.bepStartDate)} – ${fmtDate(std.bepEndDate)}</p>
                  <p class="muted sm-gap" style="margin-top:8px">Önce dersi seçin, ardından her kısa dönemli amaç için başlama ve bitiş tarihini seçin; ölçme tarihi bitiş tarihine otomatik yazılır, isterseniz takvimden değiştirebilirsiniz. Ardından öğrencinin amacı yapıp yapmadığını işaretleyin. Her değişiklik anında kaydedilir.</p>
                </section>
                <div class="tabs" role="tablist" aria-label="Dersler">${tabs}</div>
                <section class="card">

        function buildMeasureDocHtml(std, sel) {
            const teacher = esc(`${appState.currentUser.firstName} ${appState.currentUser.lastName}`.trim());
            const idx = (sel && sel.length ? sel : std.bep.map((_, i) => i)).filter(i => std.bep[i]);
            let yes = 0, no = 0, left = 0;
            idx.forEach(i => { const c = areaCounts(std.bep[i]); yes += c.yes; no += c.no; left += c.left; });
            const done = yes + no;
            const pct = done ? Math.round((yes / done) * 100) : 0;
            return idx.map((ai, pos) => {
                const area = std.bep[ai];
                const rows = (area.kdaList || []).map((k, ki) => `
                  <tr>
                    <td class="c">${ki + 1}</td>
                    <td>${esc(stripCode(area, k.description))}</td>
                    <td class="c sm">${rangeText(k.startDate, k.endDate)}</td>
                    <td class="c sm">${esc(k.measureMethod || 'Gözlem')}</td>
                    <td class="c sm">${showDate(k.measureDate)}</td>
                    <td class="c mark">${k.result === 'yapiyor' ? 'X' : ''}</td>
                    <td class="c mark">${k.result === 'yapamiyor' ? 'X' : ''}</td>
                  </tr>`).join('');
                const ac = areaCounts(area);
                const last = pos === idx.length - 1;
                return `
                <div class="doc doc-portrait paper WordSection1 ${pos > 0 ? 'sec-break' : ''}" data-sheet="${esc(area.area)}" data-chars="110">
                  <h2 class="doc-title">ÖLÇME DEĞERLENDİRME FORMU</h2>
                  <table>
                    <colgroup><col style="width:30%"><col style="width:70%"></colgroup>
                    <tbody>
                      <tr><td class="k">Öğrenci</td><td>${esc(std.firstName)} ${esc(std.lastName)}</td></tr>
                      <tr><td class="k">Okul / Sınıf / No</td><td>${esc(std.schoolName)} / ${classLabel(std)} / ${esc(std.schoolNo)}</td></tr>
                      <tr><td class="k">Gelişim Alanı / Ders</td><td>${esc(area.area)}</td></tr>
                      <tr><td class="k">Uzun Dönemli Amaç</td><td>${esc(area.uda)}</td></tr>
                      <tr><td class="k">BEP Dönemi</td><td>${fmtDate(std.bepStartDate)} - ${fmtDate(std.bepEndDate)}</td></tr>
                    </tbody>
                  </table>
                  <table>
                    <colgroup><col style="width:6%"><col style="width:30%"><col style="width:14%"><col style="width:14%"><col style="width:12%"><col style="width:12%"><col style="width:12%"></colgroup>
                    <thead>
                      <tr><th class="bar dark" colspan="7">Kısa Dönemli Amaçların Ölçme Değerlendirmesi</th></tr>
                      <tr><th>No</th><th>Kısa Dönemli Amaç</th><th>Başlama - Bitiş</th><th>Ölçme Yöntemi</th><th>Ölçme Tarihi</th><th>Yapıyor</th><th>Yapamıyor</th></tr>
                    </thead>
                    <tbody>${rows}
                      <tr><td class="k" colspan="5">Bu alanda toplam</td><td class="c"><strong>${ac.yes}</strong></td><td class="c"><strong>${ac.no}</strong></td></tr>
                    </tbody>
                  </table>
                  ${last && idx.length > 1 ? `<table>
                    <colgroup><col style="width:30%"><col style="width:70%"></colgroup>
                    <tbody>
                      <tr><td class="k">Genel sonuç</td><td>Yapıyor: ${yes} &nbsp; Yapamıyor: ${no} &nbsp; İşaretlenmedi: ${left} ${done ? ` &nbsp; (Başarı oranı: %${pct})` : ''}</td></tr>
                    </tbody>
                  </table>` : ''}
                  <div class="nobreak">
                    <table>
                      <colgroup><col style="width:50%"><col style="width:50%"></colgroup>
                      <thead><tr><th>Değerlendiren Öğretmen</th><th>Okul Müdürü</th></tr></thead>
                      <tbody><tr><td class="sig">${teacher}<br><br>İmza:</td><td class="sig">${esc(std.principalName) || ''}<br><br>İmza:</td></tr></tbody>
                    </table>
                  </div>
                </div>`;
            }).join('');
        }

        function renderMeasureDoc() {
            const std = appState.generatedBEP;
            if (!std) return '';
            let sel = (appState.measureDocSel || []).filter(i => std.bep[i]);
            if (!sel.length) sel = std.bep.map((_, i) => i);
            appState.measureDocSel = sel;
            const back = `<button onclick="setView('measure')" class="text-blue-700 font-bold flex items-center bg-blue-50 px-4 py-2 rounded-lg hover:bg-blue-100 transition"><i data-lucide="arrow-left" class="mr-2 w-5 h-5"></i> Ölçme Değerlendirmeye Dön</button>`;
            const chips = std.bep.length > 1 ? `
              <div class="w-full max-w-[210mm] mb-4 hide-on-print doc-chips" role="group" aria-label="Formda yer alacak dersler">
                <span class="doc-chips-label">Formda yer alacak dersler:</span>
                ${std.bep.map((a, i) => `<button type="button" class="chip ${sel.includes(i) ? 'on' : ''}" aria-pressed="${sel.includes(i)}" onclick="toggleMeasureDoc(${i})">${sel.includes(i) ? '&#10003; ' : ''}${esc(a.area)}</button>`).join('')}
              </div>` : '';
            return `
            <div class="min-h-screen bg-slate-200 p-4 md:p-8 flex flex-col items-center">
              ${docToolbar(std, back, 'measure-wrapper', 'OlcmeDegerlendirme', 'OlcmeDegerlendirme')}
              ${chips}
              <div id="measure-wrapper" class="w-full">${buildMeasureDocHtml(std, sel)}</div>
            </div>`;
        }

            return `
            <div class="min-h-screen bg-slate-200 p-4 md:p-8 flex flex-col items-center">
              ${docToolbar(std, back, 'abc-wrapper', 'ABC_Kaydi', 'ABC_Kaydi')}
              <div id="abc-wrapper" class="w-full">${buildAbcDocHtml(std)}</div>
            </div>`;
        }

        function renderBEP() {
            const std = appState.generatedBEP;
            if (!std) return '';
            const anaBEP = bepDocHtml(std, std.bep, '', false);
            const destekList = std.bep.filter(a => (std.supportRoomCourses || []).includes(a.area));
            const destekBEP = (std.usesSupportRoom === 'Evet' && destekList.length > 0)
                ? `<div class="hide-on-print" style="text-align:center;color:#94a3b8;font-weight:bold;margin:8px 0 24px">AŞAĞIDAKİ BÖLÜM "DESTEK EĞİTİM ODASI" İÇİN AYRI BİR DOSYADIR</div>${bepDocHtml(std, destekList, 'DESTEK EĞİTİM ODASI ', true)}`
                : '';
            const back = `<button onclick="setView('dashboard')" class="text-blue-700 font-bold flex items-center bg-blue-50 px-4 py-2 rounded-lg hover:bg-blue-100 transition"><i data-lucide="arrow-left" class="mr-2 w-5 h-5"></i> Panele Dön</button>`;
            return `
            <div class="min-h-screen bg-slate-200 p-4 md:p-8 flex flex-col items-center">
              ${docToolbar(std, back, 'bep-wrapper', 'BEP', 'BEP')}
              <div id="bep-wrapper" class="w-full">${anaBEP}${destekBEP}</div>
            </div>`;
        }

        function renderEvalForms() {
            const std = appState.generatedBEP;
            if (!std) return '';
            const back = `<button onclick="setView('bepView')" class="text-blue-700 font-bold flex items-center bg-blue-50 px-4 py-2 rounded-lg hover:bg-blue-100 transition"><i data-lucide="arrow-left" class="mr-2 w-5 h-5"></i> BEP Dosyasına Dön</button>`;
            return `
            <div class="min-h-screen bg-slate-200 p-4 md:p-8 flex flex-col items-center">
              ${docToolbar(std, back, 'eval-wrapper', 'OBOA', 'OBOA')}
              <div id="eval-wrapper" class="w-full">${buildEvaluationFormsHtml(std)}</div>
            </div>`;
        }

        function renderApp() {
            const root = document.getElementById('root');
            if (window.BEP_API && !window.BEP_USER) { root.innerHTML = renderAuth(); if (window.lucide) lucide.createIcons(); return; }
            switch(appState.view) {
                case 'dashboard': root.innerHTML = renderDashboard(); break;
                case 'profile': root.innerHTML = renderProfile(); break;
                case 'addStudent': root.innerHTML = renderAddStudent(); break;
                case 'selectCourses': root.innerHTML = renderSelectCourses(); break;
                case 'assessment': root.innerHTML = renderAssessment(); break;
                case 'selectGoals': root.innerHTML = renderGoalSelection(); break;
                case 'bepView': root.innerHTML = renderBEP(); break;
                case 'evalFormsView': root.innerHTML = renderEvalForms(); break;
                case 'measure': root.innerHTML = renderMeasure(); break;
                case 'activities': root.innerHTML = renderActivities(); break;
                case 'abc': root.innerHTML = renderAbc(); break;
                case 'abcDoc': root.innerHTML = renderAbcDoc(); break;
                case 'activityDoc': root.innerHTML = renderActivityDoc(); break;
                case 'measureDoc': root.innerHTML = renderMeasureDoc(); break;
            }
            if (['addStudent', 'selectCourses', 'assessment', 'selectGoals'].includes(appState.view)) {
                root.insertAdjacentHTML('afterbegin', `<header class="appbar hide-on-print"><div class="appbar-in"><button class="iconbtn" onclick="goHome()" aria-label="Ana sayfa" title="Ana sayfa"><i data-lucide="home" class="ic"></i></button><div class="appbar-title"><strong>Öğrenci kaydı</strong></div></div></header>`);
            }
            if (window.lucide) lucide.createIcons();
        }

        window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__bepInstallPrompt = e; if (appState.view === 'profile') renderApp(); });
        function installApp() {
            const p = window.__bepInstallPrompt; if (!p) return;
            p.prompt(); p.userChoice.finally(() => { window.__bepInstallPrompt = null; renderApp(); });
        }
        if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
        }
        window.onload = renderApp;
    </script>
</body>
</html>
