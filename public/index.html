l 5, 6, 7. sınıflarda uygulanıyor (MEB TEGM duyurusu: https://tegm.meb.gov.tr/www/2026-2027-egitim-ogretim-yili-taslak-cerceve-planlar-yayinlandi/icerik/1316/tr); 4. sınıf bu duyuruda geçmiyor, dolayısıyla 4. sınıfta 2018 programının sürdüğü çıkarımı yapıldı (açık bir 'eski program sürüyor' cümlesi doğrulanamadı). Not: tymm.meb.gov.tr'de 4. sınıf TYMM Fen programı (FB.4.x.x kodlu) da yayımlanmış durumda (https://tymm.meb.gov.tr/ogretim-programlari/fen-bilimleri-dersi/5); bu dosyada kullanılmadı.","items":[{"code":"F.4.1.1.1","text":"Yer kabuğunun kara tabakasının kayaçlardan oluştuğunu belirtir."},{"code":"F.4.1.1.2","text":"Kayaçlarla madenleri ilişkilendirir ve kayaçların ham madde olarak önemini tartışır."},{"code":"F.4.1.1.3","text":"Fosillerin oluşumunu açıklar."},{"code":"F.4.1.2.1","text":"Dünya'nın dönme ve dolanma hareketleri arasındaki farkı açıklar."},{"code":"F.4.1.2.2","text":"Dünya'nın hareketleri sonucu gerçekleşen olayları açıklar."},{"code":"F.4.2.1.1","text":"Canlı yaşamı ve besin içerikleri arasındaki ilişkiyi açıklar."},{"code":"F.4.2.1.2","text":"Su ve minerallerin bütün besinlerde bulunduğu çıkarımını yapar."},{"code":"F.4.2.1.3","text":"Sağlıklı bir yaşam için besinlerin tazeliğinin ve doğallığının önemini, araştırma verilerine dayalı olarak tartışır."},{"code":"F.4.2.1.4","text":"İnsan sağlığı ile dengeli beslenmeyi ilişkilendirir."},{"code":"F.4.2.1.5","text":"Alkol ve sigara kullanımının insan sağlığına olan olumsuz etkilerinin farkına varır."},{"code":"F.4.2.1.6","text":"Yakın çevresinde sigara kullanımını azaltmaya yönelik sorumluluk üstlenir."},{"code":"F.4.3.1.1","text":"Kuvvetin, cisimlere hareket kazandırmasına ve cisimlerin şekillerini değiştirmesine yönelik deneyler yapar."},{"code":"F.4.3.2.1","text":"Mıknatısı tanır ve kutupları olduğunu keşfeder."},{"code":"F.4.3.2.2","text":"Mıknatısın etki ettiği maddeleri deney yaparak keşfeder."},{"code":"F.4.3.2.3","text":"Mıknatısların günlük yaşamdaki kullanım alanlarına örnekler verir."},{"code":"F.4.3.2.4","text":"Mıknatısların yeni kullanım alanları konusunda fikirlerini açıklar."},{"code":"F.4.4.1.1","text":"Beş duyu organını kullanarak maddeyi niteleyen temel özellikleri açıklar."},{"code":"F.4.4.2.1","text":"Farklı maddelerin kütle ve hacimlerini ölçerek karşılaştırır."},{"code":"F.4.4.2.2","text":"Ölçülebilir özelliklerini kullanarak maddeyi tanımlar."},{"code":"F.4.4.3.1","text":"Maddelerin hâllerine ait temel özellikleri karşılaştırır."},{"code":"F.4.4.3.2","text":"Aynı maddenin farklı hâllerine örnekler verir."},{"code":"F.4.4.4.1","text":"Maddelerin ısınıp soğumasına yönelik deneyler tasarlar."},{"code":"F.4.4.4.2","text":"Maddelerin ısı etkisiyle hâl değiştirebileceğine yönelik deney tasarlar."},{"code":"F.4.4.5.1","text":"Günlük yaşamında sıklıkla kullandığı maddeleri saf madde ve karışım şeklinde sınıflandırarak aralarındaki farkları açıklar."},{"code":"F.4.4.5.2","text":"Günlük yaşamda karşılaştığı karışımların ayrılmasında kullanılabilecek yöntemlerden uygun olanı seçer."},{"code":"F.4.4.5.3","text":"Karışımların ayrılmasını, ülke ekonomisine katkısı ve kaynakların etkili kullanımı bakımından tartışır."},{"code":"F.4.5.1.1","text":"Geçmişte ve günümüzde kullanılan aydınlatma araçlarını karşılaştırır."},{"code":"F.4.5.1.2","text":"Gelecekte kullanılabilecek aydınlatma araçlarına yönelik tasarım yapar."},{"code":"F.4.5.2.1","text":"Uygun aydınlatma hakkında araştırma yapar."},{"code":"F.4.5.2.2","text":"Aydınlatma araçlarının tasarruflu kullanımının aile ve ülke ekonomisi bakımından önemini tartışır."},{"code":"F.4.5.3.1","text":"Işık kirliliğinin nedenlerini sorgular."},{"code":"F.4.5.3.2","text":"Işık kirliliğinin, doğal hayata ve gök cisimlerinin gözlenmesine olan olumsuz etkilerini açıklar."},{"code":"F.4.5.3.3","text":"Işık kirliliğini azaltmaya yönelik çözümler üretir."},{"code":"F.4.5.4.1","text":"Geçmişte ve günümüzde kullanılan ses teknolojilerini karşılaştırır."},{"code":"F.4.5.4.2","text":"Şiddetli sese sahip teknolojik araçların olumlu ve olumsuz etkilerini araştırır."},{"code":"F.4.5.5.1","text":"Ses kirliliğinin nedenlerini sorgular."},{"code":"F.4.5.5.2","text":"Ses kirliliğinin insan sağlığı ve çevre üzerindeki olumsuz etkilerini açıklar."},{"code":"F.4.5.5.3","text":"Ses kirliliğini azaltmaya yönelik çözümler üretir."},{"code":"F.4.6.1.1","text":"Kaynakların kullanımında tasarruflu davranmaya özen gösterir."},{"code":"F.4.6.1.2","text":"Yaşam için gerekli olan kaynakların ve geri dönüşümün önemini fark eder."},{"code":"F.4.7.1.1","text":"Basit elektrik devresini oluşturan devre elemanlarını işlevleri ile tanır."},{"code":"F.4.7.1.2","text":"Çalışan bir elektrik devresi kurar."},{"code":"F.4.7.1.3","text":"Evde ve okuldaki elektrik düğmelerinin ve kabloların birer devre elemanı olduğunu bilir."}]},"Matematik":{"program":"Matematik Dersi Öğretim Programı (İlkokul ve Ortaokul 1, 2, 3, 4, 5, 6, 7 ve 8. Sınıflar), MEB Talim ve Terbiye Kurulu Başkanlığı, Ankara, 2018","url":"https://mufredat.meb.gov.tr/Dosyalar/201813017165445-MATEMATİK%20ÖĞRETİM%20PROGRAMI%202018v.pdf","status":"Büyük olasılıkla uygulanıyor ama dolaylı teyit: 2026-2027'de TYMM yalnızca 1,2,3 ve 5,6,7. sınıflarda uygulanacağı için 4. sınıfta 2018 Matematik Dersi Öğretim Programı sürüyor (tymm.meb.gov.tr/taslak-cerceve-planlari). Açık bir 'yürürlükte' ifadesi bulunamadı.","items":[{"code":"M.4.1.1.1","text":"4, 5 ve 6 basamaklı doğal sayıları okur ve yazar."},{"code":"M.4.1.1.2","text":"10 000’e kadar (10 000 dâhil) yüzer ve biner sayar."},{"code":"M.4.1.1.3","text":"4, 5 ve 6 basamaklı doğal sayıların bölüklerini ve basamaklarını, basamaklarındaki rakamların basamak değerlerini belirler ve çözümler."},{"code":"M.4.1.1.4","text":"Doğal sayıları en yakın onluğa veya yüzlüğe yuvarlar."},{"code":"M.4.1.1.5","text":"En çok altı basamaklı doğal sayıları büyük/küçük sembolü kullanarak sıralar."},{"code":"M.4.1.1.6","text":"Belli bir kurala göre artan veya azalan sayı örüntüleri oluşturur ve kuralını açıklar."},{"code":"M.4.1.2.1","text":"En çok dört basamaklı doğal sayılarla toplama işlemini yapar."},{"code":"M.4.1.2.2","text":"İki doğal sayının toplamını tahmin eder ve tahminini işlem sonucu ile karşılaştırır."},{"code":"M.4.1.2.3","text":"En çok dört basamaklı doğal sayıları 100'ün katlarıyla zihinden toplar."},{"code":"M.4.1.2.4","text":"Doğal sayılarla toplama işlemini gerektiren problemleri çözer."},{"code":"M.4.1.3.1","text":"En çok dört basamaklı doğal sayılarla çıkarma işlemini yapar."},{"code":"M.4.1.3.2","text":"Üç basamaklı doğal sayılardan 10'un katı olan iki basamaklı doğal sayıları ve 100'ün katı olan üç basamaklı doğal sayıları zihinden çıkarır."},{"code":"M.4.1.3.3","text":"Doğal sayılarla yapılan çıkarma işleminin sonucunu tahmin eder, tahminini işlem sonucuyla karşılaştırır."},{"code":"M.4.1.3.4","text":"Doğal sayılarla toplama ve çıkarma işlemini gerektiren problemleri çözer."},{"code":"M.4.1.4.1","text":"Üç basamaklı doğal sayılarla iki basamaklı doğal sayıları çarpar."},{"code":"M.4.1.4.2","text":"Üç doğal sayı ile yapılan çarpma işleminde sayıların birbirleriyle çarpılma sırasının değişmesinin, sonucu değiştirmediğini gösterir."},{"code":"M.4.1.4.3","text":"En çok üç basamaklı doğal sayıları 10, 100 ve 1000'in en çok dokuz katı olan doğal sayılarla; en çok iki basamaklı doğal sayıları 5, 25 ve 50 ile kısa yoldan çarpar."},{"code":"M.4.1.4.4","text":"En çok üç basamaklı doğal sayıları 10, 100 ve 1000 ile zihinden çarpar."},{"code":"M.4.1.4.5","text":"En çok iki basamaklı bir doğal sayı ile bir basamaklı bir doğal sayının çarpımını tahmin eder ve tahminini işlem sonucu ile karşılaştırır."},{"code":"M.4.1.4.6","text":"Doğal sayılarla çarpma işlemini gerektiren problemleri çözer."},{"code":"M.4.1.5.1","text":"Üç basamaklı doğal sayıları en çok iki basamaklı doğal sayılara böler."},{"code":"M.4.1.5.2","text":"En çok dört basamaklı bir sayıyı bir basamaklı bir sayıya böler."},{"code":"M.4.1.5.3","text":"Son üç basamağı sıfır olan en çok beş basamaklı doğal sayıları 10, 100 ve 1000'e zihinden böler."},{"code":"M.4.1.5.4","text":"Bir bölme işleminin sonucunu tahmin eder ve tahminini işlem sonucu ile karşılaştırır."},{"code":"M.4.1.5.5","text":"Çarpma ve bölme arasındaki ilişkiyi fark eder."},{"code":"M.4.1.5.6","text":"Doğal sayılarla en az bir bölme işlemi gerektiren problemleri çözer."},{"code":"M.4.1.5.7","text":"Aralarında eşitlik durumu olan iki matematiksel ifadeden birinde verilmeyen değeri belirler ve eşitliğin sağlandığını açıklar."},{"code":"M.4.1.5.8","text":"Aralarında eşitlik durumu olmayan iki matematiksel ifadenin eşit olması için yapılması gereken işlemleri açıklar."},{"code":"M.4.1.6.1","text":"Basit, bileşik ve tam sayılı kesri tanır ve modellerle gösterir."},{"code":"M.4.1.6.2","text":"Birim kesirleri karşılaştırır ve sıralar."},{"code":"M.4.1.6.3","text":"Bir çokluğun belirtilen bir basit kesir kadarını belirler."},{"code":"M.4.1.6.4","text":"Paydaları eşit olan en çok üç kesri karşılaştırır."},{"code":"M.4.1.7.1","text":"Paydaları eşit kesirlerle toplama ve çıkarma işlemi yapar."},{"code":"M.4.1.7.2","text":"Kesirlerle toplama ve çıkarma işlemlerini gerektiren problemleri çözer."},{"code":"M.4.2.1.1","text":"Üçgen, kare ve dikdörtgenin kenarlarını ve köşelerini isimlendirir."},{"code":"M.4.2.1.2","text":"Kare ve dikdörtgenin kenar özelliklerini belirler."},{"code":"M.4.2.1.3","text":"Üçgenleri kenar uzunluklarına göre sınıflandırır."},{"code":"M.4.2.1.4","text":"Açınımı verilen küpü oluşturur."},{"code":"M.4.2.1.5","text":"İzometrik ya da kareli kâğıda eş küplerle çizilmiş olarak verilen modellere uygun basit yapılar oluşturur."},{"code":"M.4.2.2.1","text":"Ayna simetrisini, geometrik şekiller ve modeller üzerinde açıklayarak simetri doğrusunu çizer."},{"code":"M.4.2.2.2","text":"Verilen şeklin doğruya göre simetriğini çizer."},{"code":"M.4.2.3.1","text":"Düzlemi tanır ve örneklendirir."},{"code":"M.4.2.3.2","text":"Açıyı oluşturan ışınları ve köşeyi belirler, açıyı isimlendirir ve sembolle gösterir."},{"code":"M.4.2.3.3","text":"Açıları, standart olmayan birimlerle ölçer ve standart ölçme birimlerinin gerekliliğini açıklar."},{"code":"M.4.2.3.4","text":"Açıları standart açı ölçme araçlarıyla ölçerek dar, dik, geniş ve doğru açı olarak belirler."},{"code":"M.4.2.3.5","text":"Standart açı ölçme araçları kullanarak ölçüsü verilen açıyı oluşturur."},{"code":"M.4.3.1.1","text":"Standart uzunluk ölçme birimlerinden milimetrenin kullanım alanlarını belirtir."},{"code":"M.4.3.1.2","text":"Uzunluk ölçme birimleri arasındaki ilişkileri açıklar ve birbiri cinsinden yazar."},{"code":"M.4.3.1.3","text":"Doğrudan ölçebileceği bir uzunluğu en uygun uzunluk ölçme birimiyle tahmin eder ve tahminini ölçme yaparak kontrol eder."},{"code":"M.4.3.1.4","text":"Uzunluk ölçme birimlerinin kullanıldığı en çok üç işlem gerektiren problemleri çözer."},{"code":"M.4.3.2.1","text":"Kare ve dikdörtgenin çevre uzunlukları ile kenar uzunlukları arasındaki ilişkiyi açıklar."},{"code":"M.4.3.2.2","text":"Aynı çevre uzunluğuna sahip farklı geometrik şekiller oluşturur."},{"code":"M.4.3.2.3","text":"Şekillerin çevre uzunluklarını hesaplamayla ilgili problemleri çözer."},{"code":"M.4.3.3.1","text":"Şekillerin alanlarının, bu alanı kaplayan birimkarelerin sayısı olduğunu belirler."},{"code":"M.4.3.3.2","text":"Kare ve dikdörtgenin alanını toplama ve çarpma işlemleri ile ilişkilendirir."},{"code":"M.4.3.4.1","text":"Zaman ölçme birimleri arasındaki ilişkiyi açıklar."},{"code":"M.4.3.4.2","text":"Zaman ölçme birimlerinin kullanıldığı problemleri çözer."},{"code":"M.4.3.5.1","text":"Yarım ve çeyrek kilogramı gram cinsinden ifade eder."},{"code":"M.4.3.5.2","text":"Kilogram ve gramı kütle ölçerken birlikte kullanır."},{"code":"M.4.3.5.3","text":"Ton ve miligramın kullanıldığı yerleri belirler."},{"code":"M.4.3.5.4","text":"Ton-kilogram, kilogram-gram, gram-miligram arasındaki ilişkiyi açıklar ve birbirine dönüştürür."},{"code":"M.4.3.5.5","text":"Ton, kilogram, gram ve miligram ile ilgili problemleri çözer."},{"code":"M.4.3.6.1","text":"Mililitrenin kullanıldığı yerleri açıklar."},{"code":"M.4.3.6.2","text":"Litre ve mililitre arasındaki ilişkiyi açıklar ve birbirine dönüştürür."},{"code":"M.4.3.6.3","text":"Litre ve mililitreyi miktar belirtmek için bir arada kullanır."},{"code":"M.4.3.6.4","text":"Bir kaptaki sıvının miktarını, litre ve mililitre birimleriyle tahmin eder ve ölçme yaparak tahminini kontrol eder."},{"code":"M.4.3.6.5","text":"Litre ve mililitre ile ilgili problemleri çözer."},{"code":"M.4.4.1.1","text":"Sütun grafiğini inceler, grafik üzerinde yorum ve tahminler yapar."},{"code":"M.4.4.1.2","text":"Sütun grafiğini oluşturur."},{"code":"M.4.4.1.3","text":"Elde ettiği veriyi sunmak amacıyla farklı gösterimler kullanır."},{"code":"M.4.4.1.4","text":"Sütun grafiği, tablo ve diğer grafiklerle gösterilen bilgileri kullanarak günlük hayatla ilgili problemler çözer."}]},"Sosyal Bilgiler":{"program":"T.C. Millî Eğitim Bakanlığı Sosyal Bilgiler Dersi Öğretim Programı (İlkokul ve Ortaokul 4, 5, 6 ve 7. Sınıflar), Ankara 2018","url":"https://mufredat.meb.gov.tr/Dosyalar/201812103847686-SOSYAL%20B%C4%B0LG%C4%B0LER%20%C3%96%C4%9ERET%C4%B0M%20PROGRAMI%20.pdf","status":"Evet, 2026-2027'de 4. sınıfta 2018 programı yürürlükte. MEB TEGM duyurusu (https://tegm.meb.gov.tr/www/2026-2027-egitim-ogretim-yili-taslak-cerceve-planlar-yayinlandi/icerik/1316/tr): TYMM programları 2026-2027'de ilkokul 1, 2, 3 ve ortaokul 5, 6, 7'de uygulanır; 4. sınıf listede yok. Menderes İlçe MEB sayfası (meb.gov.tr alt alan adı) aynen: \"İlkokul 4. sınıflarda ise hâlihazırdaki öğretim programları devam edecektir.\"","items":[{"code":"SB.4.1.1","text":"Resmî kimlik belgesini inceleyerek kişisel kimliğine ilişkin çıkarımlarda bulunur."},{"code":"SB.4.1.2","text":"Yaşamına ilişkin belli başlı olayları kronolojik sıraya koyar."},{"code":"SB.4.1.3","text":"Bireysel ilgi, ihtiyaç ve yeteneklerini tanır."},{"code":"SB.4.1.4","text":"Kendisini farklı özelliklere sahip diğer bireylerin yerine koyar."},{"code":"SB.4.1.5","text":"Diğer bireylerin farklı özelliklerini saygı ile karşılar."},{"code":"SB.4.2.1","text":"Sözlü, yazılı, görsel kaynaklar ve nesnelerden yararlanarak aile tarihi çalışması yapar."},{"code":"SB.4.2.2","text":"Ailesi ve çevresindeki millî kültürü yansıtan ögeleri araştırarak örnekler verir."},{"code":"SB.4.2.3","text":"Geleneksel çocuk oyunlarını değişim ve süreklilik açısından günümüzdeki oyunlarla karşılaştırır."},{"code":"SB.4.2.4","text":"Millî Mücadele kahramanlarının hayatlarından hareketle Millî Mücadele’nin önemini kavrar."},{"code":"SB.4.3.1","text":"Çevresindeki herhangi bir yerin konumu ile ilgili çıkarımlarda bulunur."},{"code":"SB.4.3.2","text":"Günlük yaşamında kullandığı mekânların krokisini çizer."},{"code":"SB.4.3.3","text":"Yaşadığı çevredeki doğal ve beşerî unsurları ayırt eder."},{"code":"SB.4.3.4","text":"Çevresinde meydana gelen hava olaylarını gözlemleyerek bulgularını resimli grafiklere aktarır."},{"code":"SB.4.3.5","text":"Yaşadığı yer ve çevresindeki yer şekilleri ve nüfus özellikleri hakkında çıkarımlarda bulunur."},{"code":"SB.4.3.6","text":"Doğal afetlere yönelik gerekli hazırlıkları yapar."},{"code":"SB.4.4.1","text":"Çevresindeki teknolojik ürünleri, kullanım alanlarına göre sınıflandırır."},{"code":"SB.4.4.2","text":"Teknolojik ürünlerin geçmişteki ve bugünkü kullanımlarını karşılaştırır."},{"code":"SB.4.4.3","text":"Kullandığı teknolojik ürünlerin mucitlerini ve bu ürünlerin zaman içerisindeki gelişimini araştırır."},{"code":"SB.4.4.4","text":"Çevresindeki ihtiyaçlardan yola çıkarak kendine özgü ürünler tasarlamaya yönelik fikirler geliştirir."},{"code":"SB.4.4.5","text":"Teknolojik ürünleri kendisine, başkalarına ve doğaya zarar vermeden kullanır."},{"code":"SB.4.5.1","text":"İstek ve ihtiyaçlarını ayırt ederek ikisi arasında bilinçli seçimler yapar."},{"code":"SB.4.5.2","text":"Ailesi ve yakın çevresindeki başlıca ekonomik faaliyetleri tanır."},{"code":"SB.4.5.3","text":"Sorumluluk sahibi bir birey olarak bilinçli tüketici davranışları sergiler."},{"code":"SB.4.5.4","text":"Kendine ait örnek bir bütçe oluşturur."},{"code":"SB.4.5.5","text":"Çevresindeki kaynakları israf etmeden kullanır."},{"code":"SB.4.6.1","text":"Çocuk olarak sahip olduğu haklara örnekler verir."},{"code":"SB.4.6.2","text":"Aile ve okul yaşamındaki söz ve eylemlerinin sorumluluğunu alır."},{"code":"SB.4.6.3","text":"Okul yaşamında gerekli gördüğü eğitsel sosyal etkinlikleri önerir."},{"code":"SB.4.6.4","text":"Ülkesinin bağımsızlığı ile bireysel özgürlüğü arasındaki ilişkiyi açıklar."},{"code":"SB.4.7.1","text":"Dünya üzerindeki çeşitli ülkeleri tanıtır."},{"code":"SB.4.7.2","text":"Türkiye’nin komşuları ve diğer Türk Cumhuriyetleri ile olan ilişkilerini kavrar."},{"code":"SB.4.7.3","text":"Farklı ülkelere ait kültürel unsurlarla ülkemizin sahip olduğu kültürel unsurları karşılaştırır."},{"code":"SB.4.7.4","text":"Farklı kültürlere saygı gösterir."}]},"Türkçe":{"program":"Türkçe Dersi Öğretim Programı (İlkokul ve Ortaokul 1, 2, 3, 4, 5, 6, 7 ve 8. Sınıflar), MEB Talim ve Terbiye Kurulu Başkanlığı, Ankara, 2019","url":"https://mufredat.meb.gov.tr/Dosyalar/20195716392253-02-T%C3%BCrk%C3%A7e%20%C3%96%C4%9Fretim%20Program%C4%B1%202019.pdf","status":"2026-2027 eğitim öğretim yılında TYMM ilkokulda yalnızca 1, 2 ve 3. sınıflarda uygulanır; 4. sınıfta mevcut (2019) program sürer (kaynak: https://tymm.meb.gov.tr/taslak-cerceve-planlari ve menderes.meb.gov.tr ilçe MEM duyurusu). Not: tymm.meb.gov.tr'deki TYMM ilkokul Türkçe PDF'i 4. sınıf içeriğini de barındırıyor (2026 kapaklı) ama uygulama duyurusuna göre 4. sınıf için henüz yürürlükte değil.","items":[{"code":"T.4.1.1","text":"Görselden/görsellerden hareketle dinleyeceği/izleyeceği metnin konusunu tahmin eder."},{"code":"T.4.1.2","text":"Dinlediklerinde/izlediklerinde geçen olayların gelişimi ve sonucu hakkında tahminde bulunur."},{"code":"T.4.1.3","text":"Dinlediği/izlediği metni ana hatlarıyla anlatır."},{"code":"T.4.1.4","text":"Dinlediklerinde/izlediklerinde geçe eve-planlari/ortaogretim duyurusu 'TYMM programları 2026-2027'de ortaöğretimde hazırlık ve 9-10. sınıflarda uygulanmaya devam edecek, 11. sınıflarda uygulanmaya başlayacak; diğer kademelerde mevcut programlar sürecek'; ogm.meb.gov.tr/www/2026-2027-egitim-ogretim-yili-turkiye-yuzyili-maarif-modeli-taslak-cerceve-planlar-yayimlandi/icerik/2633 duyurusu: 'hazırlık, 9, 10 ve 11. sınıflarda TYMM; 12. sınıfta önceki programlar'.","items":[{"code":"MAT.10.1.1","text":"Dik üçgende trigonometrik oranlara (sinüs, kosinüs, tanjant, kotanjant) ve trigonometrik özdeşliklere ilişkin çıkarım yapabilme"},{"code":"MAT.10.1.2","text":"Üçgenin yardımcı elemanlarının özellikleri ile ilgili çıkarım yapabilme"},{"code":"MAT.10.1.3","text":"Üçgenin bir kenarı ve o kenara ait yüksekliğinin değişimine bağlı olarak alanının değişimine ilişkin çıkarım yapabilme"},{"code":"MAT.10.1.4","text":"Sinüs ve kosinüs teoremlerini doğrulayabilme veya ispatlayabilme"},{"code":"MAT.10.2.1","text":"İki kategorik değişkenli veri ile çalışabilme ve iki kategorik değişken arasındaki ilişkililiğe dayalı karar verebilme"},{"code":"MAT.10.2.2","text":"Başkaları tarafından oluşturulan iki kategorik değişkenli verilerin ilişkililiğine dayalı istatistiksel sonuç veya yorumları tartışabilme"},{"code":"MAT.10.3.1","text":"Bir doğal sayı ile asal çarpanları ve bölenleri arasındaki ilişkilere dair çıkarım yapabilme"},{"code":"MAT.10.3.2","text":"Birden çok doğal sayının ortak bölenleriyle bunların en büyüğü ve ortak katlarıyla bunların en küçüğü arasındaki ilişkilere dair muhakeme yapabilme"},{"code":"MAT.10.3.3","text":"Bir doğal sayının belirli doğal sayılara bölümünden kalanlarına dair muhakeme yapabilme"},{"code":"MAT.10.4.1","text":"Gerçek sayılarda fonksiyon olma şartları ile gerçek sayılarda tanımlı fonksiyonların nitel özelliklerini matematiksel temsillerle değerlendirebilme"},{"code":"MAT.10.4.2","text":"Gerçek sayılarda f(x) = x² şeklinde tanımlı karesel referans fonksiyonun nitel özellikleri ile bu fonksiyo sizliklerin çözüm kümelerini bulur."},{"code":"12.1.3.2","text":"Üstel ve logaritmik fonksiyonları gerçek hayat durumlarını modellemede kullanır."},{"code":"12.2.1.1","text":"Dizi kavramını fonksiyon kavramıyla ilişkilendirerek açıklar."},{"code":"12.2.1.2","text":"Genel terimi veya indirgeme bağıntısı verilen bir sayı dizisinin terimlerini bulur."},{"code":"12.2.1.3","text":"Aritmetik ve geometrik dizilerin özelliklerini kullanarak işlemler yapar."},{"code":"12.2.1.4","text":"Diziler yardımıyla gerçek hayat durumları ile ilgili problemler çözer."},{"code":"12.3.1.1","text":"İki açının ölçüleri toplamının ve farkının trigonometrik değerlerine ait formülleri oluşturarak işlemler yapar."},{"code":"12.3.1.2","text":"İki kat açı formüllerini oluşturarak işlemler yapar."},{"code":"12.3.2.1","text":"Trigonometrik denklemlerin çözüm kümelerini bulur."},{"code":"12.4.1.1","text":"Analitik düzlemde koordinatları verilen bir noktanın öteleme, dönme ve simetri dönüşümleri altındaki görüntüsünün koordinatlarını bulur."},{"code":"12.4.1.2","text":"Temel dönüşümler ve bileşkeleriyle ilgili problem çözer."},{"code":"12.5.1.1","text":"Bir fonksiyonun bir noktadaki limiti, soldan limit ve sağdan limit kavramlarını açıklar."},{"code":"12.5.1.2","text":"Limit ile ilgili özellikleri belirterek uygulamalar yapar."},{"code":"12.5.1.3","text":"Bir fonksiyonun bir noktadaki sürekliliğini açıklar."},{"code":"12.5.2.1","text":"Türev kavramını açıklayarak işlemler yapar."},{"code":"12.5.2.2","text":"Bir fonksiyonun bir noktada ve bir aralıkta türevlenebilirliğini değerlendirir."},{"code":"12.5.2.3","text":"Türevlenebilen iki fonksiyonun toplamı, farkı, çarpımı ve bölümünün türevine ait kurallar yardımıyla işlemler yapar."},{"code":"12.5.2.4","text":"İki fonksiyonun bileşkesinin türevine ait kuralı (zincir kuralı) oluşturularak türev hesabı yapar."},{"code":"12.5.3.1","text":"Bir fonksiyonun artan veya azalan olduğu aralıkları türev yardımıyla belirler."},{"code":"12.5.3.2","text":"Bir fonksiyonun mutlak maksimum ve mutlak minimum, yerel maksimum, yerel minimum noktalarını belirler."},{"code":"12.5.3.3","text":"Türevi yardımıyla bir fonksiyonun grafiğini çizer."},{"code":"12.5.3.4","text":"Maksimum ve minimum problemlerini türev yardımıyla çözer."},{"code":"12.6.1.1","text":"Bir fonksiyonun belirsiz integralini açıklayarak integral alma kurallarını oluşturur."},{"code":"12.6.1.2","text":"Değişken değiştirme yoluyla integral alma işlemleri yapar."},{"code":"12.6.2.1","text":"Bir fonksiyonun grafiği ile x ekseni arasında kalan sınırlı bölgenin alanını Riemann toplamı yardımıyla yaklaşık olarak hesaplar."},{"code":"12.6.2.2","text":"Bir fonksiyonun belirli ve belirsiz integralleri arasındaki ilişkiyi açıklayarak işlemler yapar."},{"code":"12.6.2.3","text":"Belirli integralin özelliklerini kullanarak işlemler yapar."},{"code":"12.6.2.4","text":"Belirli integral ile alan hesabı yapar."},{"code":"12.7.1.1","text":"Merkezi ve yarıçapı verilen çemberin denklemini oluşturur."},{"code":"12.7.1.2","text":"Denklemleri verilen doğru ile çemberin birbirine göre durumlarını belirleyerek işlemler yapar."}]}}},"Ortaokul":{"5":{"Fen Bilimleri":{"program":"Fen Bilimleri Dersi Öğretim Programı (3, 4, 5, 6, 7 ve 8. Sınıflar), Türkiye Yüzyılı Maarif Modeli, MEB TTKB, 2024","url":"https://tymm.meb.gov.tr/upload/program/2024programfen345678Onayli.pdf","status":"Yürürlükte (TYMM). MEB 2026-2027 taslak çerçeve planı duyurusuna göre (tymm.meb.gov.tr/taslak-cerceve-planlari; menderes.meb.gov.tr duyurusu) 2026-2027'de ortaokul 5, 6 ve 7. sınıflarda Maarif Modeli programları uygulanır; 8. sınıflarda mevcut programlar sürer.","items":[{"code":"FB.5.1.1.1","text":"Güneş’in yapısı ve dönme hareketi ile ilgili bilgileri toplayabilme"},{"code":"FB.5.1.2.1","text":"Ay’ın özellikleri, dönme ve dolanma hareketleri ile ilgili bilimsel çıkarım yapabilme"},{"code":"FB.5.1.2.2","text":"Ay’ın evrelerini temsil eden bilimsel model oluşturabilme"},{"code":"FB.5.1.3.1","text":"Güneş, Dünya ve Ay’ın m.meb.gov.tr/taslak-cerceve-planlari) 8. sınıflarda mevcut öğretim programlarının uygulanmasına devam edilir; TYMM Fen programı 2026-2027'de 8. sınıfta uygulanmaz.","items":[{"code":"F.8.1.1.1","text":"Mevsimlerin oluşumuna yönelik tahminlerde bulunur."},{"code":"F.8.1.2.1","text":"İklim ve hava olayları arasındaki farkı açıklar."},{"code":"F.8.1.2.2","text":"İklim biliminin (klimatoloji) bir bilim dalı olduğunu ve bu alanda çalışan uzmanlara iklim bilimci (klimatolog) adı verildiğini söyler."},{"code":"F.8.2.1.1","text":"Nükleotid, gen, DNA ve kromozom kavramlarını açıklayarak bu kavramlar arasında ilişki kurar."},{"code":"F.8.2.1.2","text":"DNA’nın yapısını model üzerinde gösterir."},{"code":"F.8.2.1.3","text":"DNA’nın kendini nasıl eşlediğini ifade eder."},{"code":"F.8.2.2.1","text":"Kalıtım ile ilgili kavramları tanımlar."},{"code":"F.8.2.2.2","text":"Tek karakter çaprazlamaları ile ilgili problemler çözerek sonuçlar hakkında yorum yapar."},{"code":"F.8.2.2.3","text":"Akraba evliliklerinin genetik sonuçlarını tartışır."},{"code":"F.8.2.3.1","text":"Örneklerden yola çıkarak mutasyonu açıklar."},{"code":"F.8.2.3.2","text":"Örneklerden yola çıkarak modifikasyonu açıklar."},{"code":"F.8.2.3.3","text":"Mutasyonla modifikasyon arasındaki farklar ile ilgili çıkarımda bulunur."},{"code":"F.8.2.4.1","text":"Canlıların yaşadıkları çevreye uyumlarını gözlem yaparak açıklar."},{"code":"F.8.2.5.1","text":"Genetik mühendisliğini ve biyoteknolojiyi ilişkilendirir."},{"code":"F.8.2.5.2","text":"Biyoteknolojik uygulamalar kapsamında oluşturulan ikilemlerle bu uygulamaların insanlık için yararlı ve zararlı yönlerini tartışır."},{"code":"F.8.2.5.3","text":"Gelecekteki genetik mühendisliği ve biyoteknoloji uygulamalarının neler olabileceği hakkında tahminde bulunur."},{"code":"F.8.3.1.1","text":"Katı basıncını etkileyen değişkenleri deneyerek keşfeder."},{"code":"F.8.3.1.2","text":"Sıvı basıncını etkileyen değişkenleri tahmin eder ve tahminlerini test eder."},{"code":"F.8.3.1.3","text":"Katı, sıvı ve gazların basınç özelliklerinin günlük yaşam ve teknolojideki uygulamalarına örnekler verir."},{"code":"F.8.4.1.1","text":"Periyodik sistemde, grup ve periyotların nasıl oluşturulduğunu açıklar."},{"code":"F.8.4.1.2","text":"Elementleri periyodik tablo üzerinde metal, yarımetal ve ametal olarak sınıflandırır."},{"code":"F.8.4.2.1","text":"Fiziksel ve kimyasal değişim arasındaki farkları, çeşitli olayları gözlemleyerek açıklar."},{"code":"F.8.4.3.1","text":"Bileşiklerin kimyasal tepkime sonucunda oluştuğunu bilir."},{"code":"F.8.4.4.1","text":"Asit ve bazların genel özelliklerini ifade eder."},{"code":"F.8.4.4.2","text":"Asit ve bazlara günlük yaşamdan örnekler verir."},{"code":"F.8.4.4.3","text":"Günlük hayatta ulaşılabilecek malzemeleri asit-baz ayracı olarak kullanır."},{"code":"F.8.4.4.4","text":"Maddelerin asitlik ve bazlık durumlarına ilişkin pH değerlerini kullanarak çıkarımda bulunur."},{"code":"F.8.4.4.5","text":"Asit ve bazların çeşitli maddeler üzerindeki etkilerini gözlemler."},{"code":"F.8.4.4.6","text":"Asit ve bazların temizlik malzemesi olarak kullanılması esnasında oluşabilecek tehlikelerle ilgili gerekli tedbirleri alır."},{"code":"F.8.4.4.7","text":"Asit yağmurlarının önlenmesine yönelik çözüm önerileri sunar."},{"code":"F.8.4.5.1","text":"Isınmanın maddenin cinsine, kütlesine ve/veya sıcaklık değişimine bağlı olduğunu deney yaparak keşfeder."},{"code":"F.8.4.5.2","text":"Hâl değiştirmek için gerekli ısının maddenin cinsi ve kütlesiyle ilişkili olduğunu deney yaparak keşfeder."},{"code":"F.8.4.5.3","text":"Maddelerin hâl değişimi ve ısınma grafiğini çizerek yorumlar."},{"code":"F.8.4.5.4","text":"Günlük yaşamda meydana gelen hâl değişimleri ile ısı alışverişini ilişkilendirir."},{"code":"F.8.4.6.1","text":"Geçmişten günümüze Türkiye’deki kimya endüstrisinin gelişimini araştırır."},{"code":"F.8.4.6.2","text":"Kimya endüstrisinde meslek dallarını araştırır ve gelecekteki yeni meslek alanları hakkında öneriler sunar."},{"code":"F.8.5.1.1","text":"Basit makinelerin sağladığı avantajları örnekler üzerinden açıklar."},{"code":"F.8.5.1.2","text":"Basit makinelerden yararlanarak günlük yaşamda iş kolaylığı sağlayacak bir düzenek tasarlar."},{"code":"F.8.6.1.1","text":"Besin zincirindeki üretici, tüketici, ayrıştırıcılara örnekler verir."},{"code":"F.8.6.2.1","text":"Bitkilerde besin üretiminde fotosentezin önemini fark eder."},{"code":"F.8.6.2.2","text":"Fotosentez hızını etkileyen faktörler ile ilgili çıkarımlarda bulunur."},{"code":"F.8.6.2.3","text":"Canlılarda solunumun önemini belirtir."},{"code":"F.8.6.3.1","text":"Madde döngülerini şema üzerinde göstererek açıklar."},{"code":"F.8.6.3.2","text":"Madde döngülerinin yaşam açısından önemini sorgular."},{"code":"F.8.6.3.3","text":"Küresel iklim değişikliklerinin nedenlerini ve olası sonuçlarını tartışır."},{"code":"F.8.6.4.1","text":"Kaynakların kullanımında tasarruflu davranmaya özen gösterir."},{"code":"F.8.6.4.2","text":"Kaynakların tasarruflu kullanımına yönelik proje tasarlar."},{"code":"F.8.6.4.3","text":"Geri dönüşüm için katı atıkların ayrıştırılmasının önemini açıklar."},{"code":"F.8.6.4.4","text":"Geri dönüşümün ülke ekonomisine katkısına ilişkin araştırma verilerini kullanarak çözüm önerileri sunar."},{"code":"F.8.6.4.5","text":"Kaynakların tasarruflu kullanılmaması durumunda gelecekte karşılaşılabilecek problemleri belirterek çözüm önerileri sunar."},{"code":"F.8.7.1.1","text":"Elektriklenmeyi, bazı doğa olayları ve teknolojideki uygulama örnekleri ile açıklar."},{"code":"F.8.7.1.2","text":"Elektrik yüklerini sınıflandırarak aynı ve farklı cins elektrik yüklerinin birbirlerine etkisini açıklar."},{"code":"F.8.7.1.3","text":"Deneyler yaparak elektriklenme çeşitlerini fark eder."},{"code":"F.8.7.2.1","text":"Cisimleri, sahip oldukları elektrik yükleri bakımından sınıflandırır."},{"code":"F.8.7.2.2","text":"Topraklamayı açıklar."},{"code":"F.8.7.3.1","text":"Elektrik enerjisinin ısı, ışık ve hareket enerjisine dönüştüğü uygulamalara örnekler verir."},{"code":"F.8.7.3.2","text":"Elektirik enerjisinin ısı, ışık veya hareket enerjisine dönüşümü temel alan bir model tasarlar."},{"code":"F.8.7.3.3","text":"Güç santrallerinde elektrik enerjisinin nasıl üretildiğini açıklar."},{"code":"F.8.7.3.4","text":"Güç santrallerinin avantaj ve dezavantajları konusunda fikirler üretir."},{"code":"F.8.7.3.5","text":"Elektrik enerjisinin bilinçli ve tasarruflu kullanılmasının aile ve ülke ekonomisi bakımından önemini tartışır."},{"code":"F.8.7.3.6","text":"Evlerde elektriği tasarruflu kullanmaya özen gösterir."}]},"T.C. İnkılap Tarihi ve Atatürkçülük":{"program":"T.C. İnkılap Tarihi ve Atatürkçülük Dersi Öğretim Programı (8. Sınıf), Türkiye Yüzyılı Maarif Modeli, 2024 (kapak)","url":"https://mufredat.meb.gov.tr/Dosyalar/2025825154713595-ink%C4%B1lap%208.pdf","status":"BELİRSİZ: mufredat.meb.gov.tr'de TYMM 8. sınıf programı yayımlı (dosya adı 2025-08-25 yüklemesi). Ancak menderes.meb.gov.tr (MEB ilçe sitesi, TEGM taslak çerçeve planı haberi) 2026-2027'de TYMM'nin 5-6-7'de uygulanacağını, 8. sınıflarda mevcut programların devam edeceğini belirtiyor; 'mevcut' programın bu TYMM metni mi 2018 programı mı olduğu doğrulanamadı. PDF'te onay/yürürlük ifadesi bulunamadı.","items":[{"code":"İTA.8.1.1","text":"Mustafa Kemal’in doğduğu dönemde Osmanlı Devleti’nin içinde bulunduğu siyasi, sosyal ve ekonomik durumu neden ve sonuçlarıyla yorumlayabilme"},{"code":"İTA.8.1.2","text":"Çocuk, komutan ve devlet adamı olarak Atatürk’ün hayatına ilişkin oluşturduğu özgün ürünleri paylaşabilme"},{"code":"İTA.8.1.3","text":"Mustafa Kemal’in kişilik özelliklerini özetleyebilme"},{"code":"İTA.8.2.1","text":"Birinci Dünya Savaşı’nın nedenlerini tarihsel bağlamına uygun olarak açıklayabilme"},{"code":"İTA.8.2.2","text":"Osmanlı Devleti’nin Birinci Dünya Savaşı’na katılma sürecine ilişkin alternatif fikirler üretebilme"},{"code":"İTA.8.2.3","text":"Osmanlı Devleti’nin Birinci Dünya Savaşı’nda savaştığı cephelerin savaşın gidişatına etkisini sorgulayabilme"},{"code":"İTA.8.2.4","text":"Birinci Dünya Savaşı’nın sonuçlarını tablo, grafik, şekil ve diyagram üzerinden yorumlayabilme"},{"code":"İTA.8.2.5","text":"Birinci Dünya Savaşı’nın Türk toplumuna etkilerine yönelik bakış açısı geliştirebilme"},{"code":"İTA.8.3.1","text":"Mondros Mütarekesi’ne karşı Osmanlı yönetiminin, Mustafa Kemal’in, aydınların ve halkın tutumunu karşılaştırabilme"},{"code":"İTA.8.3.2","text":"Millî Mücadele’nin hazırlık sürecinde yapılan çalışmaların etkilerini değerlendirebilme"},{"code":"İTA.8.3.3","text":"Millî Mücadele sürecinde meydana gelen siyasi ve askerî gelişmeleri neden ve sonuçlarıyla birlikte yorumlayabilme"},{"code":"İTA.8.3.4","text":"Türk milletinin Millî Mücadele sürecindeki rolüne ilişkin oluşturduğu özgün ürünleri paylaşabilme"},{"code":"İTA.8.4.1","text":"Cumhuriyet’in ilanına kadar geçen süreçte meydana gelen siyasi ve diplomatik gelişmeleri özetleyebilme"},{"code":"İTA.8.4.2","text":"Türk modernleşmesi çerçevesinde Atatürk’ün yaptığı inkılapları neden ve sonuçlarıyla yorumlayabilme"},{"code":"İTA.8.4.3","text":"Atatürk ilke ve inkılapları arasındaki ilişkiyi ortaya koyan özgün bir ürün oluşturabilme"}]},"Matematik":{"program":"Ortaokul Matematik Dersi Öğretim Programı (5, 6, 7 ve 8. Sınıflar), Türkiye Yüzyılı Maarif Modeli, 2026 (kapakta '2O26')","url":"https://tymm.meb.gov.tr/assets/pdf/ortaokul-matematik-dersi_20260902_111111_630.pdf","status":"TYMM programı; MEB tymm.meb.gov.tr 'Ortaokul Matematik Dersi' sayfasında 5, 6, 7 ve 8. sınıflar için yayımlı (sınıf sayfası: https://tymm.meb.gov.tr/ogretim-programlari/ortaokul-matematik-dersi/9). PDF metninde yürürlük tarihi/takvimi belirtilmiyor; 8. sınıfta eski 2018 programının sürüp sürmediği resmî kaynaktan teyit edilemedi.","items":[{"code":"MAT.8.1.1","text":"Farklı bağlamlardaki üslü ifadelere, özelliklerine ve üslü ifadelerle yapılan işlemlere ilişkin çıkarım yapabilme"},{"code":"MAT.8.1.2","text":"Karşılaştığı problem durumlarında kareköklü ifadeler ile ilgili muhakeme yapabilme"},{"code":"MAT.8.1.3","text":"Sayıların rasyonel ya da irrasyonelliğini değerlendirebilme"},{"code":"MAT.8.1.4","text":"Gerçek sayıları ve aralıklarını sayı doğrusunda yorumlayabilme"},{"code":"MAT.8.2.1","text":"Gerçek yaşam durumları üzerinden dik koordinat sistemini çözümleyebilme"},{"code":"MAT.8.2.2","text":"Gerçek yaşam durumlarındaki doğrusal ilişkileri doğrusal fonksiyonlarla temsil edebilme"},{"code":"MAT.8.2.3","text":"Dik koordinat sisteminde iki doğrusal fonksiyonun birbirine göre durumuna ilişkin çıkarım yapabilme"},{"code":"MAT.8.2.4","text":"Doğrusal fonksiyonlara ilişkin problemlerin çözümlerini algoritma ifade yöntemlerini kullanarak yapılandırabilme"},{"code":"MAT.8.3.1","text":"Matematiksel araç ve teknoloji yardımıyla üçgenin kenarları ve açıları arasındaki ilişkiyi yorumlayabilme"},{"code":"MAT.8.3.2","text":"Matematiksel araç ve teknoloji yardımıyla üçgenin kenar uzunlukları arasındaki ilişkiye yönelik çıkarım yapabilme"},{"code":"MAT.8.3.3","text":"Bir üçgene eş üçgen oluşturmak için üçgenle ilgili bilinmesi yeterli olan elemanlara dair çıkarım yapabilme"},{"code":"MAT.8.3.4","text":"Bir üçgene benzer üçgen oluşturmak için üçgenle ilgili bilinmesi yeterli olan elemanlara dair çıkarım yapabilme"},{"code":"MAT.8.3.5","text":"Kenar uzunlukları a²+ b²= c² eşitliğini sağlayan üçgenleri oluşturarak dik üçgen olduklarını; dik üçgenlerde dik kenar uzunluklarının kareleri toplamının hipotenüs uzunluğunun karesine eşit olduğunu yorumlayabilme"},{"code":"MAT.8.3.6","text":"Üçgende açı-kenar ilişkisi, üçgen eşitsizliği ve Pisagor bağıntısını içeren problemleri çözebilme"},{"code":"MAT.8.4.1","text":"Dik prizmalar, dikdörtgen dik piramit, dik dairesel silindir ve dik dairesel koninin yüzey açınımlarını çözümleyebilme"},{"code":"MAT.8.4.2","text":"Dik dairesel silindirin yüzey açınımına ilişkin deneyimlerini dik dairesel silindirin yüzey alanına yansıtabilme"},{"code":"MAT.8.4.3","text":"Dairenin alan bağıntısının oluşturulma sürecinden har         // Öğrencinin kademe ve sınıfına göre ders -> {uda, methods, materials, kdaList, official}

        const distributeDates = (kdaCount, startDateStr, endDateStr) => {
            if (kdaCount === 0 || !parseLocal(startDateStr) || !parseLocal(endDateStr)) return [];
            
            let start = parseLocal(startDateStr);
            let end = parseLocal(endDateStr);
            
            let workingDays = [];
            let current = new Date(start);
            while (current <= end) {
                let day = current.getDay();
                if (day !== 0 && day !== 6) { // Hafta sonunu dahil etme
                    workingDays.push(new Date(current));
                }
                current.setDate(current.getDate() + 1);
            }
            
            if (workingDays.length === 0) {
                workingDays.push(start);
                workingDays.push(end);
            }

            const dates = [];
            const chunkSize = Math.floor(workingDays.length / kdaCount);
            let remainder = workingDays.length % kdaCount;
            
            let currentIndex = 0;
            for (let i = 0; i < kdaCount; i++) {
                let currentChunk = chunkSize + (i < remainder ? 1 : 0);
                if (currentChunk === 0) currentChunk = 1; 
                
                let startIdx = currentIndex;
                let endIdx = currentIndex + currentChunk - 1;
                
                if (endIdx >= workingDays.length) endIdx = workingDays.length - 1;

            }
            return dates;

            const firstTenSum = digits.slice(0, 10).reduce((a, b) => a + b, 0);

            if (eleventh !== digits[10]) return false;
            return true;

        // ---- Gerçek .xlsx (sıkıştırmasız ZIP + OOXML) ----
        const CRC_TABLE = (() => {
            const t = new Uint32Array(256);
            for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
            return t;
        })();
        function crc32(buf) {
            let c = 0xFFFFFFFF;
            for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
            return (c ^ 0xFFFFFFFF) >>> 0;
        }
        function makeZip(files) {
            const enc = new TextEncoder();
            const parts = [], central = [];
            let offset = 0;
            files.forEach(f => {
                const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
                const lh = new DataView(new ArrayBuffer(30));
                lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
                lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true);
                lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
                parts.push(new Uint8Array(lh.buffer), name, data);
                const ch = new DataView(new ArrayBuffer(46));
                ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
                ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true);
                ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
                ch.setUint32(42, offset, true);
                central.push(new Uint8Array(ch.buffer), name);
                offset += 30 + name.length + data.length;
            });
            const cdSize = central.reduce((a, c) => a + c.length, 0);
            const end = new DataView(new ArrayBuffer(22));
            end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
            end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
            return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        }

        const xe = (v) => String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        function colName(i) { let s = '', n = i + 1; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
        function cellText(el) {
            const c = el.cloneNode(true);
            c.querySelectorAll('br').forEach(b => b.replaceWith('\n'));
            return c.textContent.split('\n').map(l => l.replace(/\s+/g, ' ').trim()).join('\n').replace(/^\n+|\n+$/g, '');
        }

        function tableModel(t) {
            const declared = [...t.querySelectorAll(':scope > colgroup > col')].map(c => parseFloat(c.style.width) || 0);
            const trs = [...t.querySelectorAll(':scope > thead > tr, :scope > tbody > tr')];
            const occ = [], cells = [];
            let ncols = 0;
            trs.forEach((tr, r) => {
                occ[r] = occ[r] || [];
                let c = 0;
                [...tr.children].forEach(td => {
                    while (occ[r][c]) c++;
                    const cs = td.colSpan || 1, rs = td.rowSpan || 1;
                    for (let i = 0; i < rs; i++) { occ[r + i] = occ[r + i] || []; for (let j = 0; j < cs; j++) occ[r + i][c + j] = true; }
                    cells.push({ el: td, r, c, cs, rs });
                    c += cs; ncols = Math.max(ncols, c);
                });
            });
            const widths = (declared.length === ncols && declared.every(Boolean)) ? declared : Array(ncols).fill(1);
            const total = widths.reduce((a, b) => a + b, 0);
            const bounds = [0];
            widths.forEach(w => bounds.push(+(bounds[bounds.length - 1] + w * 100 / total).toFixed(1)));
            bounds[bounds.length - 1] = 100;
            return { cells, bounds, nrows: trs.length };
        }

        function buildSheet(el, name) {
            const blocks = [];
            (function walk(node) {
                for (const ch of node.children) {
                    if (ch.classList.contains('hide-on-print')) continue;
                    if (ch.tagName === 'TABLE') { blocks.push({ kind: 'table', model: tableModel(ch) }); continue; }
                    if (ch.classList.contains('sign-final')) {
                        for (const p of ch.children) blocks.push({ kind: 'text', text: cellText(p), cls: 'final', space: p.classList.contains('sigspace') });
                        continue;
                    }
                    if (ch.querySelector('table')) { walk(ch); continue; }
                    const text = cellText(ch);
                    if (text) blocks.push({ kind: 'text', text, cls: /^H[12]$/.test(ch.tagName) ? 'title' : ch.classList.contains('doc-sub') ? 'sub' : 'plain' });
                }
            })(el);

            const models = blocks.filter(b => b.kind === 'table').map(b => b.model);
            const gridB = [...new Set([0, 100, ...models.flatMap(m => m.bounds)])].sort((a, b) => a - b);
            const G = gridB.length - 1;
            const chars = +el.dataset.chars || 100;
            const colW = gridB.slice(1).map((b, i) => Math.max(2.5, (b - gridB[i]) * chars / 100));
            const spanW = (a, b) => colW.slice(a, b + 1).reduce((x, y) => x + y, 0);
            const lines = (text, w, big) => text.split('\n').reduce((n, l) => n + Math.max(1, Math.ceil(l.length / (w * (big ? 0.8 : 1.15)))), 0);

            const rows = new Map(), merges = [], heights = new Map(), pending = [];
            const put = (r, c, v, st) => { if (!rows.has(r)) rows.set(r, new Map()); rows.get(r).set(c, { v, st }); };
            const bump = (r, h) => heights.set(r, Math.max(heights.get(r) || 18, Math.min(h, 400)));
            let R = 0;

            blocks.forEach(b => {
                if (b.kind === 'text') {
                    const st = b.cls === 'title' ? { f: 3, fill: 0, bd: 0, h: 'center' }
                        : (b.cls === 'sub' || b.cls === 'final') ? { f: b.cls === 'final' ? 1 : 0, fill: 0, bd: 0, h: 'center' }
                        : { f: 0, fill: 0, bd: 0, h: 'left' };
                    for (let c = 0; c < G; c++) put(R, c, c === 0 ? b.text : '', st);
                    if (G > 1) merges.push([R, 0, R, G - 1]);
                    bump(R, b.space ? 40 : lines(b.text, spanW(0, G - 1), b.cls === 'title') * 13.5 + (b.cls === 'title' ? 10 : 5));
                    R += 1;
                    return;
                }
                const m = b.model;
                const idx = (v) => gridB.indexOf(v);
                m.cells.forEach(({ el: td, r, c, cs, rs }) => {
                    const g0 = idx(m.bounds[c]), g1 = idx(m.bounds[c + cs]) - 1;
                    const r0 = R + r, r1 = r0 + rs - 1;
                    const isTh = td.tagName === 'TH', cl = td.classList;
                    const st = isTh
                        ? (cl.contains('bar') ? { f: cl.contains('dark') ? 2 : 1, fill: cl.contains('dark') ? 2 : cl.contains('sub') ? 3 : 1, bd: 1, h: 'left' } : { f: 1, fill: 1, bd: 1, h: 'center' })
                        : { f: cl.contains('k') ? 1 : 0, fill: 0, bd: 1, h: cl.contains('c') ? 'center' : 'left' };
                    const text = cellText(td);
                    for (let rr = r0; rr <= r1; rr++) for (let cc = g0; cc <= g1; cc++) put(rr, cc, (rr === r0 && cc === g0) ? text : '', st);
                    if (g1 > g0 || r1 > r0) merges.push([r0, g0, r1, g1]);
                    const need = lines(text, spanW(g0, g1)) * 13.5 + 6;
                    if (rs === 1) bump(r0, need); else pending.push({ r0, r1, need });
                    if (cl.contains('mark') || cl.contains('sig')) bump(r0, 32);
                });
                pending.splice(0).forEach(p => {
                    let sum = 0; for (let rr = p.r0; rr <= p.r1; rr++) sum += heights.get(rr) || 18;
                    if (sum < p.need) bump(p.r1, (heights.get(p.r1) || 18) + (p.need - sum));
                });
                R += m.nrows;
                bump(R, 8); put(R, 0, '', { f: 0, fill: 0, bd: 0, h: 'left' }); heights.set(R, 8);
                R += 1;
            });
            return { name, rows, merges, heights, colW, land: el.classList.contains('doc-land') };
        }

        function buildXlsx(sheets) {
            const xfs = [], xfIdx = new Map();
            const xf = (st) => {
                const key = `${st.f}|${st.fill}|${st.bd}|${st.h}`;
                if (!xfIdx.has(key)) { xfIdx.set(key, xfs.length); xfs.push(st); }
                return xfIdx.get(key);
            };
            xf({ f: 0, fill: 0, bd: 0, h: 'left' });

            const sheetXml = sheets.map(sh => {
                const maxR = Math.max(...sh.rows.keys(), 0);
                let data = '';
                for (let r = 0; r <= maxR; r++) {
                    const row = sh.rows.get(r);
                    if (!row) continue;
                    const ht = sh.heights.get(r) || 18;
                    data += `<row r="${r + 1}" ht="${ht.toFixed(1)}" customHeight="1">`;
                    [...row.keys()].sort((a, b) => a - b).forEach(c => {

                const mg = sh.merges.length ? `<mergeCells count="${sh.merges.length}">${sh.merges.map(([a, b, c, d]) => `<mergeCell ref="${colName(b)}${a + 1}:${colName(d)}${c + 1}"/>`).join('')}</mergeCells>` : '';

            });

            const FILLS = ['', '', 'FFE2E8F0', 'FF1E293B', 'FFF1F5F9'];
            const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="4"><font><sz val="10"/><name val="Arial"/></font><font><b/><sz val="10"/><name val="Arial"/></font><font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Arial"/></font><font><b/><sz val="14"/><name val="Arial"/></font></fonts>
<fills count="5"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>${[2, 3, 4].map(i => `<fill><patternFill patternType="solid"><fgColor rgb="${FILLS[i]}"/><bgColor indexed="64"/></patternFill></fill>`).join('')}</fills>
<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FF000000"/></left><right style="thin"><color rgb="FF000000"/></right><top style="thin"><color rgb="FF000000"/></top><bottom style="thin"><color rgb="FF000000"/></bottom><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="${xfs.length}">${xfs.map(st => `<xf numFmtId="0" fontId="${st.f}" fillId="${st.fill ? st.fill + 1 : 0}" borderId="${st.bd}" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="${st.h}" vertical="center" wrapText="1"/></xf>`).join('')}</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;

            const files = [
                { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
                { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
                { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((sh, i) => `<sheet name="${xe(sh.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>` },
                { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
                { name: 'xl/styles.xml', data: styles },

        function exportXlsx(elementId, filename) {
            const root = document.getElementById(elementId);

            root.querySelectorAll('[data-sheet]').forEach(el => {

            appState.selectedCourses.forEach(c => {
                const list = (dbCheck[c] && dbCheck[c].kdaList) || [];

            });

            Object.keys(appState.evaluations).forEach(course => {

        function handleGoalSelectionSubmit() {
            let selectedAny = false;
            Object.values(appState.selectedBEPGoals).forEach(arr => { if (arr.length > 0) selectedAny = true; });
            
            if (!selectedAny) { alert('Lütfen plana dahil edilecek en az bir amaç seçin.'); return; }

            const bepAreas = [];
            const isPreschool = appState.currentStudent.level === "Ana Sınıfı";
            const db = courseDb(appState.currentStudent);
            const startD = appState.currentStudent.bepStartDate;
            const endD = appState.currentStudent.bepEndDate;

            if(!startD || !endD) {
                alert("Lütfen öğrenci bilgileri ekranından BEP başlangıç ve bitiş tarihlerini belirleyiniz.");
                return;
            }

            Object.keys(appState.selectedBEPGoals).forEach(course => {
                const selectedIndices = appState.selectedBEPGoals[course];
                if (selectedIndices.length === 0) return;

                const courseData = db[course] || { uda: "Genel Beceriler", kdaList: [], methods: "", materials: "" };
                const selectedKdas = selectedIndices.map(idx => courseData.kdaList[idx]);
                const selCodes = courseData.official ? selectedIndices.map(idx => courseData.official.codes[idx]) : null;
                
                const dates = distributeDates(selectedKdas.length, startD, endD);
                
                const prevArea = ((appState.students.find(x => x.id === appState.currentStudent.id) || {}).bep || []).find(a => a.area === course);
                const kdaWithDates = selectedKdas.map((kdaStr, index) => {
                    const prev = prevArea && (prevArea.kdaList || []).find(k => k.description === kdaStr);
                    return {
                        description: kdaStr,
                        startDate: prev ? (prev.startDate || '') : '', endDate: prev ? (prev.endDate || '') : '',
                        measureMethod: prev ? (prev.measureMethod || 'Gözlem') : 'Gözlem',
                        measureDate: prev ? (prev.measureDate || '') : '', result: prev ? (prev.result || '') : ''
                    };
                });

                let materialsStr = courseData.materials || "Ders materyalleri";
                if (ACADEMIC_COURSES.includes(course) && !materialsStr.toLowerCase().includes("ders kitabı")) {
                    materialsStr = "Ders kitabı, " + materialsStr;
                }

                bepAreas.push({
                    area: course, uda: courseData.uda, methods: courseData.methods || "Doğrudan Öğretim",
                    materials: materialsStr, kdaList: kdaWithDates,
                    official: courseData.official ? { program: courseData.official.program, url: courseData.official.url, grade: courseData.official.grade, codes: selCodes } : null
                });
            });

            const isExisting = appState.currentStudent.id !== null;
            const studentToSave = {
                ...appState.currentStudent, 
                id: isExisting ? appState.currentStudent.id : Date.now(),
                bep: bepAreas, 
                evaluations: JSON.parse(JSON.stringify(appState.evaluations)), 
                selectedBEPGoals: JSON.parse(JSON.stringify(appState.selectedBEPGoals)),
                selectedCourses: JSON.parse(JSON.stringify(appState.selectedCourses)),
                createdAt: isExisting ? appState.currentStudent.createdAt : new Date().toLocaleDateString('tr-TR')
            };

            if (isExisting) { 
                const idx = appState.students.findIndex(s => s.id === studentToSave.id);
                if (idx > -1) appState.students[idx] = studentToSave;
            } else { appState.students.push(studentToSave); }

            saveStore();
            appState.generatedBEP = studentToSave;
            setView('bepView');
        }

        function daysLeft(endStr) {
            const end = parseLocal(endStr);
            if (!end) return null;
            const t = new Date(); t.setHours(0, 0, 0, 0);
            return Math.round((end - t) / 86400000);
        }

        function exportBackup() {
            const payload = { version: 1, exportedAt: new Date().toISOString(), students: appState.students };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `BEP_Yedek_${localISO(new Date())}.json`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function importBackup(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const data = JSON.parse(reader.result);
                    const incoming = Array.isArray(data) ? data : data.students;
                    if (!Array.isArray(incoming)) throw new Error('format');
                    let added = 0;
                    incoming.forEach(raw => {
                        if (!raw || typeof raw !== 'object' || !Array.isArray(raw.bep)) return;
                        const id = Number(raw.id);
                        if (!Number.isFinite(id)) return;
                        const st = { ...defaultStudentState, ...raw, id };
                        if (!Array.isArray(st.supportRoomCourses)) st.supportRoomCourses = [];
                        if (!Array.isArray(st.selectedCourses)) st.selectedCourses = [];
                        if (!st.evaluations || typeof st.evaluations !== 'object') st.evaluations = {};
                        if (!st.selectedBEPGoals || typeof st.selectedBEPGoals !== 'object') st.selectedBEPGoals = {};
                        st.bep = st.bep.filter(a => a && Array.isArray(a.kdaList));
                        const i = appState.students.findIndex(x => x.id === id);
                        if (i > -1) appState.students[i] = st; else appState.students.push(st);
                        added++;
                    });
                    saveStore(); renderApp();
                    alert(`${added} öğrenci kaydı yüklendi.`);
                } catch (e) {
                    alert('Yedek dosyası okunamadı. Bu sistemden alınmış bir yedek (.json) seçtiğinizden emin olun.');
                }
                input.value = '';
            };

            const seed = String(std.id || '') + (std.firstName || '');

        // ---- Ölçme zamanı gelen kazanımlar (ana ekran bildirimi) ----
        function groupKey(std) { return std.level === 'Ana Sınıfı' ? ('Ana Sınıfı' + (std.ageGroup ? ' · ' + std.ageGroup : '')) : std.level; }
        function measureDue() {
            const today = localISO(new Date());
            const out = [];
            appState.students.forEach(std => (std.bep || []).forEach((area, ai) => (area.kdaList || []).forEach((k, ki) => {
                if (k.result) return;
                const st = isoOf(k.startDate), en = isoOf(k.endDate), me = isoOf(k.measureDate);
                if (!st && !en && !me) return;
                let status = null;
                if ((en && en < today) || (me && me < today)) status = 'late';
                else if (me === today || en === today) status = 'today';
                else if ((!st || st <= today) && (!en || today <= en)) status = 'open';
                if (status) out.push({ std, ai, ki, area, k, status, st, en, me });
            })));
            const rank = { late: 0, today: 1, open: 2 };
            return out.sort((a, b) => rank[a.status] - rank[b.status] || (a.en || '9').localeCompare(b.en || '9'));
        }
        function openMeasureAt(id, ai) {
            const std = appState.students.find(x => x.id === id); if (!std) return;
            std.measureCourse = ai; appState.generatedBEP = std; saveStore(); setView('measure');
        }
        function dueHtml() {
            if (!appState.students.length) return '';
            const items = measureDue();
            const anyDates = appState.students.some(st => (st.bep || []).some(a => (a.kdaList || []).some(k => isoOf(k.startDate) || isoOf(k.endDate) || isoOf(k.measureDate))));
            if (!items.length) {
                return anyDates ? `<section class="card notif ok" id="bildirimler"><h2 class="card-title">Ölçme değerlendirme bildirimleri</h2><p class="muted">Şu an ölçme zamanı gelen kazanım yok.</p></section>`
                    : `<section class="card notif" id="bildirimler"><h2 class="card-title">Ölçme değerlendirme bildirimleri</h2><p class="muted">Kazanımların başlama, bitiş ve ölçme tarihlerini girdiğinizde ölçme zamanı gelenler burada hatırlatılır. Tarihleri "Ölçme ve değerlendirme formu" ekranından seçebilirsiniz.</p></section>`;
            }
            const label = { late: 'Gecikti', today: 'Bugün', open: 'Ölçme dönemi' };
            const byStd = {};
            items.forEach(it => { (byStd[it.std.id] = byStd[it.std.id] || { std: it.std, list: [] }).list.push(it); });
            const counts = { late: 0, today: 0, open: 0 };
            items.forEach(i => counts[i.status]++);
            return `<section class="card notif warn" id="bildirimler">
              <h2 class="card-title">Ölçme zamanı gelen kazanımlar <span class="count">${items.length}</span></h2>
              <p class="muted sm-gap">${counts.late ? counts.late + ' gecikmiş, ' : ''}${counts.today ? counts.today + ' bugün, ' : ''}${counts.open} ölçme döneminde. Başlama–bitiş tarihleri arasındaki kazanımlar işaretlenene kadar listelenir.</p>
              ${Object.values(byStd).map(g => `
                <div class="notif-std"><strong>${esc(g.std.firstName)} ${esc(g.std.lastName)}</strong></div>
                ${g.list.slice(0, 5).map(it => `
                  <button class="notif-row ${it.status}" onclick="openMeasureAt(${Number(it.std.id)}, ${it.ai})">
                    <span class="tag ${it.status}">${label[it.status]}</span>
                    <span class="notif-txt"><b>${esc(it.area.area)}</b> · ${esc(stripCode(it.area, it.k.description))}</span>
                    <span class="notif-date">${it.st ? fmtDate(it.st) : ''}${(it.st || it.en) ? ' – ' : ''}${it.en ? fmtDate(it.en) : ''}</span>
                  </button>`).join('')}
                ${g.list.length > 5 ? `<p class="muted" style="margin:4px 0 8px">+ ${g.list.length - 5} kazanım daha — öğrencinin ölçme formunda görebilirsiniz.</p>` : ''}`).join('')}
            </section>`;
        }
        function setFilter(v) { appState.filter = v; renderApp(); }

              ${keys.map(k => `<button class="chip ${f === k ? 'on' : ''}" onclick='setFilter(${JSON.stringify(k).replace(/'/g, "&#39;")})'>${esc(k)} (${appState.students.filter(s => groupKey(s) === k).length})</button>`).join('')}

        function exportBackup() {
            const payload = { version: 1, exportedAt: new Date().toISOString(), students: appState.students };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            downloadBlob(blob, `BEP_Yedek_${localISO(new Date())}.json`);
            toast('Yedek dosyası hazırlandı');
        }

        function importBackup(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const data = JSON.parse(reader.result);
                    const incoming = Array.isArray(data) ? data : data.students;
                    if (!Array.isArray(incoming)) throw new Error('format');
                    let added = 0;
                    incoming.forEach(raw => {
                        if (!raw || typeof raw !== 'object' || !Array.isArray(raw.bep)) return;
                        const id = Number(raw.id);
                        if (!Number.isFinite(id)) return;
                        const st = { ...defaultStudentState, ...raw, id };
                        if (!Array.isArray(st.supportRoomCourses)) st.supportRoomCourses = [];
                        if (!Array.isArray(st.selectedCourses)) st.selectedCourses = [];
                        if (!st.evaluations || typeof st.evaluations !== 'object') st.evaluations = {};
                        if (!st.selectedBEPGoals || typeof st.selectedBEPGoals !== 'object') st.selectedBEPGoals = {};
                        st.bep = st.bep.filter(a => a && Array.isArray(a.kdaList));
                        const i = appState.students.findIndex(x => x.id === id);
                        if (i > -1) appState.students[i] = st; else appState.students.push(st);
                        added++;
                    });
                    saveStore(); renderApp();
                    toast(`${added} öğrenci kaydı yüklendi`);
                } catch (e) {
                    alert('Yedek dosyası okunamadı. Bu uygulamadan alınmış bir yedek (.json) seçtiğinizden emin olun.');
                }
                input.value = '';
            };
            reader.readAsText(file);
        }

        function fileBase(std) {
            const tr = { 'ı': 'i', 'İ': 'I', 'ğ': 'g', 'Ğ': 'G', 'ü': 'u', 'Ü': 'U', 'ş': 's', 'Ş': 'S', 'ö': 'o', 'Ö': 'O', 'ç': 'c', 'Ç': 'C' };
            return `${std.firstName}_${std.lastName}`.replace(/[ıİğĞüÜşŞöÖçÇ]/g, c => tr[c]).replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'Ogrenci';
        }

        function bepDocHtml(std, bepList, titlePrefix, forceBreak) {
            if (!bepList.length) return '';
            const sp = titlePrefix ? 'Destek - ' : '';
            const crit = esc(std.criterion || '4/5 (%80)');
            const veli = esc((std.guardian === 'Anne' ? `${std.motherName} ${std.motherSurname}` : `${std.fatherName} ${std.fatherSurname}`).trim());
            const teacher = esc(`${appState.currentUser.firstName} ${appState.currentUser.lastName}`.trim()) + (appState.currentUser.branch ? ` (${esc(appState.currentUser.branch)})` : '');
            const info = (label, value) => `<tr><td class="k">${label}</td><td>${value}</td></tr>`;
            const sigRow = (title, name) => `<tr><td class="sig">${title}</td><td class="sig">${name}</td><td class="sig"></td></tr>`;
            const supportCourses = esc((std.supportRoomCourses || []).join(', '));
            // İmza satırları karar türüne göre: kaynaştırmada özel eğitim öğretmeni yok, özel eğitim sınıfında sınıf öğretmeni/BEP sorumlusu yok

            const srcNote = '<strong>Kazanım kaynakları:</strong><br>' + bepList.map(a => a.official

            const part1 = `

                </tbody>

              <table>
                <colgroup><col style="width:30%"><col style="width:23%"><col style="width:23%"><col style="width:24%"></colgroup>
                <thead>
                  <tr><th class="bar" colspan="4">Aile ile İlgili Bilgiler</th></tr>
                  <tr><th></th><th>Anne</th><th>Baba</th><th>Veli/Vasi (${esc(std.guardian)})</th></tr>
                </thead>
                <tbody>
                  <tr><td class="k">Adı-Soyadı</td><td>${esc(`${std.motherName} ${std.motherSurname}`.trim())}</td><td>${esc(`${std.fatherName} ${std.fatherSurname}`.trim())}</td><td><strong>${veli}</strong></td></tr>

              <table>

                <thead>

                </thead>
                <tbody>
                  ${bepList.map(area => `<tr><td class="k">${esc(area.area)}</td><td>${perfText(area)}</td></tr>`).join('')}
                </tbody>

            </div>`;

            // Her tablo en çok 8 satır: rowspan'lı satırlar sayfa sonunda bölünüp çerçeveyi kaydırmasın
            const CHUNK = 8;
            const planTables = bepList.map(area => {
                const chunks = [];
                for (let i = 0; i < area.kdaList.length; i += CHUNK) chunks.push(area.kdaList.slice(i, i + CHUNK));
                return chunks.map((rows, ci) => `
                <div class="nobreak">
                  <table class="plan">
                    <colgroup><col style="width:14%"><col style="width:20%"><col style="width:8%"><col style="width:13%"><col style="width:12%"><col style="width:11%"><col style="width:8%"><col style="width:7%"><col style="width:7%"></colgroup>
                    <thead>
                      <tr><th class="bar dark" colspan="9">${esc(area.area.toLocaleUpperCase('tr-TR'))}${ci > 0 ? ' (devam)' : ''}</th></tr>
                      <tr>
                        <th rowspan="2">Uzun Dönemli Amaçlar</th><th rowspan="2">Kısa Dönemli Amaçlar</th><th rowspan="2">Ölçüt</th>
                        <th rowspan="2">Yöntem ve Teknik</th><th rowspan="2">Kullanılacak Materyaller</th><th rowspan="2">Başlama ve Bitiş Tarihi</th>

                        <td>${esc(stripCode(area, kda.description))}</td>
                        <td class="c">${crit}</td>
                        ${k === 0 ? `<td rowspan="${rows.length}">${esc(area.methods)}</td><td rowspan="${rows.length}">${esc(areaMaterialText(area))}</td>` : ''}

                        <td class="c sm">${esc(kda.measureMethod || 'Gözlem')}</td><td class="c sm">${showDate(kda.measureDate)}</td><td class="c sm">${resultText(kda.result)}</td>

            }).join('');

            const part2 = `
            <div class="doc doc-land paper WordSection2" data-sheet="${sp}BEP Planı" data-chars="170">

            const part3 = `
            <div class="doc doc-portrait paper WordSection1" data-sheet="${sp}Kararlar ve İmzalar" data-chars="100">
              <table>
                <colgroup><col style="width:30%"><col style="width:35%"><col style="width:15%"><col style="width:20%"></colgroup>

                  <tr><th class="bar" colspan="4">IV- BEP Geliştirme Birim Kararları</th></tr>

                  <tr><th>Hizmet Türü</th><th>Gelişim Alanı/Ders</th><th>Haftalık Süre</th><th>Sorumlu Kişi(ler)</th></tr>
                </thead>
                <tbody>
                  ${std.usesSupportRoom === 'Evet'
                    ? `<tr><td>Destek Eğitim Odası</td><td>${supportCourses}</td><td class="c">${esc(std.supportRoomHours)} Saat</td><td>${esc(std.supportRoomTeacher) || '-'}</td></tr>`
                    : '<tr><td class="c" colspan="4" style="height:36px">Planlanmamıştır.</td></tr>'}
                </tbody>
              </table>
              <table>
                <colgroup><col style="width:65%"><col style="width:35%"></colgroup>
                <thead><tr><th class="bar sub" colspan="2">B. Aile bilgilendirme süreci</th></tr></thead>
                <tbody>
                  <tr><td>Aile öğrencinin gelişimi ile ilgili hangi sıklıkla bilgilendirilecek?</td><td><strong>${esc(std.familyInfoFrequency)}</strong></td></tr>
                  <tr><td>Aile öğrencinin gelişimi ile ilgili hangi yolla bilgilendirilecek?</td><td><strong>${esc(std.familyInfoMethod)}</strong></td></tr>
                  <tr><td>Aile eğitimi yapılacak mı?</td><td><strong>${std.familyEducation === 'Evet' ? 'Evet (X) Hayır ( )' : 'Evet ( ) Hayır (X)'}</strong></td></tr>
                </tbody>

              <table>
                <colgroup><col style="width:100%"></colgroup>
